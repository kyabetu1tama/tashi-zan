<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>たしざんチャレンジ Ver5</title>

<style>
body{
  font-family:sans-serif;
  background:#e8f8ff;
  margin:0;
}
.main{
  max-width:800px;
  margin:auto;
  padding:15px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  box-shadow:0 2px 8px #bbb;
}
h1{
  text-align:center;
  color:#ff6699;
}
button{
  font-size:24px;
  padding:12px 18px;
  border:none;
  border-radius:10px;
  margin:6px;
  cursor:pointer;
}
.sel{
  background:#42a5f5;
  color:white;
}
.start{
  background:#4caf50;
  color:white;
}
.num{
  background:#64b5f6;
  color:white;
}
.ctrl{
  background:#ff9800;
  color:white;
}
#problem{
  font-size:56px;
  text-align:center;
  margin:20px;
}
#answer{
  height:60px;
  border:3px solid #4caf50;
  border-radius:10px;
  font-size:42px;
  text-align:center;
  line-height:60px;
}
#stars{
  font-size:30px;
  white-space:pre-line;
  text-align:center;
  min-height:90px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  max-width:520px;
  margin:auto;
}
.top{
  display:flex;
  justify-content:space-between;
  font-size:24px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="main">
<div class="card">

<div id="intro" style="text-align:center">
  <h1>🌟たしざんチャレンジ🌟</h1>

  <p>もんだいすうをえらぼう</p>

  <button class="sel" onclick="setCount(10)">10もん</button>
  <button class="sel" onclick="setCount(20)">20もん</button>
  <button class="sel" onclick="setCount(30)">30もん</button>

  <p id="info">20もんをえらんでいます</p>

  <button class="start" onclick="startGame()">▶スタート</button>
</div>

<div id="game" style="display:none">

  <div class="top">
    <span id="timer">0秒</span>
    <span id="count"></span>
  </div>

  <div id="stars"></div>

  <div id="problem"></div>

  <div id="answer"></div>

  <div class="grid" id="keys"></div>

  <div id="msg"
       style="text-align:center;font-size:28px"></div>

</div>

<div id="finish"
     style="display:none;text-align:center">

  <h1>🎉おわり🎉</h1>

  <div id="medal"
       style="font-size:60px;margin:20px"></div>

  <div id="finalStars"
       style="font-size:30px;margin:20px;white-space:pre-line"></div>

  <p id="result"
     style="font-size:28px"></p>

  <button class="start"
          onclick="location.reload()">
    もういちど
  </button>

</div>

</div>
</div>

<script>

function playCorrectSound() {
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.frequency.value = 523;

  osc.start();

  setTimeout(() => {
    osc.frequency.value = 784;
  }, 120);

  setTimeout(() => {
    osc.stop();
  }, 250);
}

let total=20;
let all=[];
let qs=[];

let total=20;
let all=[];
let qs=[];
let i=0;
let score=0;
let input="";
let tries=0;
let start;
let timerId;

for(let a=0;a<=10;a++){
  for(let b=0;b<=10-a;b++){
    all.push({
      a:a,
      b:b,
      s:a+b
    });
  }
}

const $=id=>document.getElementById(id);

function setCount(n){
  total=n;
  $("info").textContent=
    n+"もんをえらんでいます";
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=
      Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function drawStars(){

  let s="";

  for(let n=1;n<=score;n++){
    s+="⭐";

    if(n%10===0){
      s+="\n";
    }
  }

  $("stars").textContent=s;
}

function makeKeys(){

  const names=[
    "1","2","3",
    "4","5","6",
    "7","8","9",
    "けす","0","けってい"
  ];

  $("keys").innerHTML="";

  names.forEach(t=>{

    const b=
      document.createElement("button");

    b.textContent=t;

    b.className=
      (t==="けす"||t==="けってい")
      ? "ctrl"
      : "num";

    b.onclick=()=>press(t);

    $("keys").appendChild(b);

  });
}

function load(){

  input="";
  tries=0;

  $("answer").textContent="";
  $("msg").textContent="";

  $("count").textContent=
    (i+1)+"/"+total;

  const q=qs[i];

  $("problem").textContent=
    `${q.a} ＋ ${q.b} = ?`;
}

function press(t){

  if(t==="けす"){
    input=input.slice(0,-1);
  }

  else if(t==="けってい"){
    judge();
    return;
  }

  else if(input.length<2){
    input+=t;
  }

  $("answer").textContent=input;
}

function judge(){

  if(input==="") return;

  const q=qs[i];

  if(Number(input)===q.s){

  score++;

  playCorrectSound();

  drawStars();

  $("msg").textContent="⭕せいかい";

    setTimeout(()=>{

      i++;

      if(i>=total){
        finishGame();
      }else{
        load();
      }

    },400);

  }else{

    tries++;

    if(tries===1){

      $("msg").textContent=
        "❌もういちど";

      input="";
      $("answer").textContent="";

    }else{

      $("msg").textContent=
        "こたえは "+q.s;

      setTimeout(()=>{

        i++;

        if(i>=total){
          finishGame();
        }else{
          load();
        }

      },700);
    }
  }
}

function finishGame(){

  clearInterval(timerId);

  const sec=
    Math.floor(
      (Date.now()-start)/1000
    );

  $("game").style.display="none";
  $("finish").style.display="block";

  let stars = "";

for(let n=1;n<=score;n++){
  stars += "⭐";

  if(n % 10 === 0){
    stars += "\n";
  }
}

$("finalStars").textContent = stars;

 let rate = score / total;
let medal = "";

if(rate === 1){
  medal = "🏆 きんメダル";
}
else if(rate >= 0.8){
  medal = "🥈 ぎんメダル";
}
else if(rate >= 0.6){
  medal = "🥉 どうメダル";
}
else{
  medal = "😊 がんばったね";
}

$("medal").textContent = medal;

$("result").innerHTML=
  `せいかい ${score} / ${total}<br>
   かかったじかん ${sec}びょう`;
}

function startGame(){

  $("intro").style.display="none";
  $("game").style.display="block";

  qs=
    shuffle(all.slice())
    .slice(0,total);

  i=0;
  score=0;

  drawStars();
  makeKeys();
  load();

  start=Date.now();

  timerId=setInterval(()=>{

    $("timer").textContent=
      Math.floor(
        (Date.now()-start)/1000
      )+"秒";

  },1000);
}

document.addEventListener(
  "keydown",
  e=>{

    if(e.key>="0" && e.key<="9"){
      press(e.key);
    }

    if(e.key==="Enter"){
      press("けってい");
    }

    if(e.key==="Backspace"){
      e.preventDefault();
      press("けす");
    }
  }
);

</script>

</body>
</html>
